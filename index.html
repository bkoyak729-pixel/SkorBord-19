<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkorBord-19</title>
<style>
body{margin:0;background:#101522;color:white;font-family:Arial}
header{background:#1c2940;padding:24px}
h1{color:#30c995}
nav{display:flex;gap:8px;padding:12px}
button{background:#263650;color:white;border:0;border-radius:10px;padding:13px;cursor:pointer}
button.active{background:#16a879}
main{padding:20px}
.card{background:#202d43;padding:18px;margin:12px 0;border-radius:14px}
small{color:#aab4c5}
</style>
</head>
<body>
<header>
<h1>⚡ SKORBORD-19</h1>
<p>Tüm sporlar, tüm skorlar!</p>
</header>
<nav>
<button class="active" onclick="load('live')">🔴 Canlı</button>
<button onclick="load('past')">📊 Sonuçlar</button>
<button onclick="load('next')">📅 Yaklaşan</button>
</nav>
<main>
<h2 id="heading">⚽ Maçlar</h2>
<div id="matches">Yükleniyor...</div>
</main>
<script>
const base="https://www.thesportsdb.com/api/v1/json/123/";
const league="4328";
async function load(mode){
 const box=document.getElementById("matches");
 box.textContent="Yükleniyor...";
 document.getElementById("heading").textContent=
 mode==="next"?"Yaklaşan Maçlar":
 mode==="past"?"Son Sonuçlar":"Maçlar";
 const endpoint=mode==="next"?"eventsnextleague.php":
 "eventspastleague.php";
 try{
  const response=await fetch(base+endpoint+"?id="+league);
  if(!response.ok)throw Error("HTTP "+response.status);
  const data=await response.json();
  const events=data.events||[];
  box.replaceChildren();
  if(!events.length){box.textContent="Maç bulunamadı.";return;}
  events.forEach(e=>{
   const card=document.createElement("div");
   card.className="card";
   const title=document.createElement("h3");
   title.textContent=(e.strHomeTeam||"?")+" "+
    (e.intHomeScore??"-")+" : "+
    (e.intAwayScore??"-")+" "+
    (e.strAwayTeam||"?");
   const detail=document.createElement("small");
   detail.textContent=(e.dateEvent||"")+" "+(e.strTime||"");
   card.append(title,detail);
   box.appendChild(card);
  });
 }catch(err){
  box.textContent="Veriler alınamadı: "+err.message;
 }
}
load("past");
</script>
</body>
</html>
